name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-check:
    name: Web Checks (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Typecheck
        run: |
          cd web
          npm run typecheck

      - name: Lint
        run: |
          cd web
          npm run lint

      - name: Vitest Unit Tests
        run: |
          cd web
          npm run test

  solver-check:
    name: Solver Checks (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: solver/requirements.txt

      - name: Install Solver Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r solver/requirements.txt

      - name: Pytest Solver Tests
        run: |
          python -m pytest solver/tests -v
