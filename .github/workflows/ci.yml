name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-check:
    name: Web Checks (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: roster_iq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/roster_iq
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/roster_iq
      SESSION_SECRET: dev-session-secret-at-least-32-chars-long!
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Generate Prisma Client
        run: |
          cd web
          npx prisma generate

      - name: Setup Database & Seed
        run: |
          cd web
          npx prisma db push --accept-data-loss
          npm run db:seed

      - name: Typecheck
        run: |
          cd web
          npm run typecheck

      - name: Lint
        run: |
          cd web
          npm run lint

      - name: Vitest Unit & Integration Tests
        run: |
          cd web
          npm run test

  solver-check:
    name: Solver Checks (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: solver/requirements.txt

      - name: Install Solver Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r solver/requirements.txt

      - name: Pytest Solver Tests
        run: |
          python -m pytest solver/tests -v
