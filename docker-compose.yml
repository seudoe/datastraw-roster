services:
  postgres:
    image: postgres:16-alpine
    container_name: roster-iq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: roster_iq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    container_name: roster-iq-solver
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SOLVER_API_KEY=dev-solver-secret-key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
